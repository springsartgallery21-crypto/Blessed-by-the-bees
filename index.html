<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blessed by the Bees - Exhibition Catalogue</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
        }
        #viewport-container {
            width: 100%;
            height: 86vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        #catalogue-frame {
            width: 100%;
            height: 100%;
            border: none;
            background-color: transparent;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            border-radius: 4px;
            opacity: 0; /* Hidden initially to avoid a layout shift visual flash while scaling */
            transition: opacity 0.2s ease-in-out;
        }
        .click-zone {
            position: absolute;
            top: 0;
            height: 100%;
            width: 25%;
            z-index: 25;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        #left-zone { left: 0; }
        #right-zone { right: 0; }

        .nav-controls {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 15px 0 25px 0;
            background-color: #111111;
            z-index: 30;
        }
        .nav-btn {
            background-color: #ff5722;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .nav-btn:hover {
            background-color: #e64a19;
        }
        .nav-btn:disabled {
            background-color: #333;
            color: #777;
            cursor: not-allowed;
            box-shadow: none;
            opacity: 0.4;
        }
        .page-select {
            background-color: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 9px 18px;
            font-size: 0.95rem;
            border-radius: 4px;
            cursor: pointer;
            outline: none;
        }
        @media (max-width: 768px) {
            #viewport-container {
                height: 78vh;
            }
        }
    </style>
</head>
<body>

    <div id="main-container">
        <div id="viewport-container">
            <div id="left-zone" class="click-zone"></div>
            <div id="right-zone" class="click-zone"></div>
            <iframe id="catalogue-frame" src="" title="Exhibition Catalogue Sheet"></iframe>
        </div>

        <div class="nav-controls">
            <button id="prev-page-btn" class="nav-btn">◀ Previous</button>
            <select id="page-dropdown" class="page-select"></select>
            <button id="next-page-btn" class="nav-btn">Next ▶</button>
        </div>
    </div>

    <script>
        const totalPages = 17;
        let currentPage = 1;
        
        const dropdown = document.getElementById('page-dropdown');
        const prevBtn = document.getElementById('prev-page-btn');
        const nextBtn = document.getElementById('next-page-btn');
        const catalogueFrame = document.getElementById('catalogue-frame');
        const leftZone = document.getElementById('left-zone');
        const rightZone = document.getElementById('right-zone');

        for (let i = 1; i <= totalPages; i++) {
            let opt = document.createElement('option');
            opt.value = i;
            opt.textContent = `Page ${i} of ${totalPages}`;
            dropdown.appendChild(opt);
        }

        function updateCatalogView(newPage) {
            currentPage = parseInt(newPage);
            dropdown.value = currentPage;
            catalogueFrame.style.opacity = "0"; // Fade frame out while updating paths
            
            let targetFile = (currentPage === 1) ? "publication.html" : `publication-${currentPage - 1}.html`;
            const targetPath = `publication-web-resources/html/${targetFile}`;
            const cacheBuster = new Date().getTime();
            
            catalogueFrame.src = `${targetPath}?cb=${cacheBuster}`;
            
            prevBtn.disabled = (currentPage === 1);
            nextBtn.disabled = (currentPage === totalPages);
        }

        // Overrides InDesign CSS structure rules dynamically immediately when document items stream in
        catalogueFrame.addEventListener('load', () => {
            try {
                const doc = catalogueFrame.contentDocument || catalogueFrame.contentWindow.document;
                
                // 1. Locate the container container generated by InDesign
                const container = doc.querySelector('div[id^="container"]') || doc.body.firstElementChild;
                
                if (container) {
                    // Extract the fixed dimensions InDesign hardcoded onto the presentation template
                    const nativeWidth = parseFloat(container.style.width) || container.offsetWidth;
                    const nativeHeight = parseFloat(container.style.height) || container.offsetHeight;
                    
                    // Determine viewport space parameters safely
                    const viewportWidth = catalogueFrame.offsetWidth;
                    const viewportHeight = catalogueFrame.offsetHeight;
                    
                    // Scale calculation formula maintaining structural aspect ratio matching contain options
                    const scaleX = viewportWidth / nativeWidth;
                    const scaleY = viewportHeight / nativeHeight;
                    const idealScale = Math.min(scaleX, scaleY, 1); // Clamp maximum scale factor bounds at 1
                    
                    // Apply visual transforms to center and scale content dynamically
                    container.style.position = "absolute";
                    container.style.top = "50%";
                    container.style.left = "50%";
                    container.style.transformOrigin = "center center";
                    container.style.transform = `translate(-50%, -50%) scale(${idealScale})`;
                    
                    // Remove side horizontal scrollbars inside frame windows completely
                    doc.body.style.overflow = "hidden";
                    doc.body.style.margin = "0";
                    doc.body.style.padding = "0";
                    doc.body.style.backgroundColor = "transparent";
                }
                
                // Show the beautifully transformed centered layout presentation frame
                catalogueFrame.style.opacity = "1";
            } catch (e) {
                // Fallback display execution rules if CORS settings trigger block protocols locally
                catalogueFrame.style.opacity = "1";
                console.warn("Cross-Origin tracking rules blocked iframe inspection. Ensure server hosting is running.");
            }
        });

        // Window resize event hook to recalculate layout dimensions on desktop adjustments
        window.addEventListener('resize', () => {
            if (catalogueFrame.src) {
                const doc = catalogueFrame.contentDocument || catalogueFrame.contentWindow.document;
                const container = doc.querySelector('div[id^="container"]') || doc.body.firstElementChild;
                if (container) {
                    const nativeWidth = parseFloat(container.getAttribute('data-nw') || container.style.width);
                    if(!container.getAttribute('data-nw')) container.setAttribute('data-nw', nativeWidth);
                    const nativeHeight = parseFloat(container.getAttribute('data-nh') || container.style.height);
                    if(!container.getAttribute('data-nh')) container.setAttribute('data-nh', nativeHeight);
                    
                    const idealScale = Math.min(catalogueFrame.offsetWidth / nativeWidth, catalogueFrame.offsetHeight / nativeHeight, 1);
                    container.style.transform = `translate(-50%, -50%) scale(${idealScale})`;
                }
            }
        });

        leftZone.addEventListener('click', () => currentPage > 1 && updateCatalogView(currentPage - 1));
        rightZone.addEventListener('click', () => currentPage < totalPages && updateCatalogView(currentPage + 1));

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                if (currentPage < totalPages) updateCatalogView(currentPage + 1);
            } else if (e.key === 'ArrowLeft') {
                if (currentPage > 1) updateCatalogView(currentPage - 1);
            }
        });

        dropdown.addEventListener('change', (e) => updateCatalogView(e.target.value));
        prevBtn.addEventListener('click', () => currentPage > 1 && updateCatalogView(currentPage - 1));
        nextBtn.addEventListener('click', () => currentPage < totalPages && updateCatalogView(currentPage + 1));

        updateCatalogView(1);
    </script>

</body>
</html>
