<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blessed by the Bees - Exhibition Catalogue</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111111;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #viewport-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .fullscreen-viewer {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        
        /* Floating Navigation Controls */
        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(255, 87, 34, 0.85); /* Gorgeous gallery orange */
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999; /* Forces arrows to sit on top of the InDesign content layout layer */
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: background-color 0.2s, transform 0.2s;
        }
        .nav-arrow:hover {
            background-color: rgba(230, 74, 25, 1);
            transform: translateY(-50%) scale(1.05);
        }
        .nav-arrow:active {
            transform: translateY(-50%) scale(0.95);
        }
        #prev-arrow {
            left: 20px;
        }
        #next-arrow {
            right: 20px;
        }
        
        /* Bottom Page Indicator HUD */
        #page-hud {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(26, 26, 26, 0.9);
            color: #ffffff;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            letter-spacing: 1px;
            z-index: 9999;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            border: 1px solid #333;
        }

        /* Mobile Optimization adjustments */
        @media (max-width: 768px) {
            .nav-arrow {
                width: 45px;
                height: 45px;
                font-size: 1.2rem;
                background-color: rgba(255, 87, 34, 0.95);
            }
            #prev-arrow { left: 10px; }
            #next-arrow { right: 10px; }
            #page-hud { bottom: 15px; padding: 6px 16px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <div id="viewport-container">
        <!-- Floating Clickable Action Anchors -->
        <button id="prev-arrow" class="nav-arrow">❮</button>
        <button id="next-arrow" class="nav-arrow">❯</button>
        
        <!-- Center Information HUD Dashboard -->
        <div id="page-hud">Page 1 of 17</div>

        <!-- Embedded Content Engine -->
        <iframe 
            id="publication-frame"
            src="publication-web-resources/html/publication.html" 
            class="fullscreen-viewer" 
            allowfullscreen>
        </iframe>
    </div>

    <script>
        const totalPages = 17;
        let currentPage = 1;
        
        const frame = document.getElementById('publication-frame');
        const hud = document.getElementById('page-hud');
        const prevBtn = document.getElementById('prev-arrow');
        const nextBtn = document.getElementById('next-arrow');

        function turnToPage(targetPage) {
            currentPage = targetPage;
            
            // Updates the tracking display HUD text strings safely
            hud.textContent = `Page ${currentPage} of ${totalPages}`;
            
            // Generates a clean cache-busting link identity sequence to force frame processing
            const cacheBuster = new Date().getTime();
            
            // Targets the nested layout document slice, feeding parameters right past blocked wrapper elements
            frame.src = `publication-web-resources/html/publication.html?page=${currentPage}&cb=${cacheBuster}`;
            
            // Manage arrow button scale layouts at extremes
            prevBtn.style.opacity = (currentPage === 1) ? "0.3" : "1";
            nextBtn.style.opacity = (currentPage === totalPages) ? "0.3" : "1";
        }

        prevBtn.addEventListener('click', () => {
            if (currentPage > 1) {
                turnToPage(currentPage - 1);
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentPage < totalPages) {
                turnToPage(currentPage + 1);
            }
        });

        // Initialize display properties 
        turnToPage(1);
    </script>

</body>
</html>
