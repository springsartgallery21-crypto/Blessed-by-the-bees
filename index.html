<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blessed by the Bees - Exhibition Catalogue</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
        }
        #viewport-container {
            width: 100%;
            height: 86vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        .frame-scaler {
            width: 1080px;
            height: 1080px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            border-radius: 4px;
            overflow: hidden;
            position: absolute;
            transform-origin: center center;
            will-change: transform;
            backface-visibility: hidden;
        }
        #catalogue-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background-color: transparent;
        }
        .click-zone {
            position: absolute;
            top: 0;
            height: 100%;
            width: 25%;
            z-index: 25;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        #left-zone { left: 0; }
        #right-zone { right: 0; }

        .nav-controls {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 15px 0 25px 0;
            background-color: #111111;
            z-index: 30;
        }
        .nav-btn {
            background-color: #ff5722;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .nav-btn:hover {
            background-color: #e64a19;
        }
        .nav-btn:disabled {
            background-color: #333;
            color: #777;
            cursor: not-allowed;
            box-shadow: none;
            opacity: 0.4;
        }
        .page-select {
            background-color: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 9px 18px;
            font-size: 0.95rem;
            border-radius: 4px;
            cursor: pointer;
            outline: none;
        }
    </style>
</head>
<body>

    <div id="main-container">
        <div id="viewport-container">
            <div id="left-zone" class="click-zone"></div>
            <div id="right-zone" class="click-zone"></div>
            
            <div id="scaler-wrapper" class="frame-scaler">
                <iframe id="catalogue-frame" src="" title="Exhibition Catalogue Sheet"></iframe>
            </div>
        </div>

        <div class="nav-controls">
            <button id="prev-page-btn" class="nav-btn">◀ Previous</button>
            <select id="page-dropdown" class="page-select"></select>
            <button id="next-page-btn" class="nav-btn">Next ▶</button>
        </div>
    </div>

    <script>
        const totalPages = 17;
        let currentPage = 1;
        
        const dropdown = document.getElementById('page-dropdown');
        const prevBtn = document.getElementById('prev-page-btn');
        const nextBtn = document.getElementById('next-page-btn');
        const catalogueFrame = document.getElementById('catalogue-frame');
        const scalerWrapper = document.getElementById('scaler-wrapper');
        const leftZone = document.getElementById('left-zone');
        const rightZone = document.getElementById('right-zone');

        for (let i = 1; i <= totalPages; i++) {
            let opt = document.createElement('option');
            opt.value = i;
            opt.textContent = `Page ${i} of ${totalPages}`;
            dropdown.appendChild(opt);
        }

        function resizeCatalogue() {
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight * 0.86;
            const nativeSize = 1080;
            const scaleX = viewportWidth / nativeSize;
            const scaleY = viewportHeight / nativeSize;
            const idealScale = Math.min(scaleX, scaleY) * 0.95; 
            scalerWrapper.style.transform = `scale(${idealScale})`;
        }

        function updateCatalogView(newPage) {
            currentPage = parseInt(newPage);
            dropdown.value = currentPage;
            
            let targetFile = (currentPage === 1) ? "publication.html" : `publication-${currentPage - 1}.html`;
            const targetPath = `publication-web-resources/html/${targetFile}`;
            const cacheBuster = new Date().getTime();
            
            catalogueFrame.src = `${targetPath}?cb=${cacheBuster}`;
            
            prevBtn.disabled = (currentPage === 1);
            nextBtn.disabled = (currentPage === totalPages);
        }

        // FORCE SHARPNESS SCRIPT INJECTION
        catalogueFrame.addEventListener('load', () => {
            try {
                const doc = catalogueFrame.contentDocument || catalogueFrame.contentWindow.document;
                
                // Remove internal iframe scrollbars completely
                doc.body.style.overflow = "hidden";
                
                // Find all image tags inside the InDesign page
                const images = doc.getElementsByTagName('img');
                
                for (let img of images) {
                    // Check if it's an artwork image (ignoring tiny icons or backgrounds if any)
                    if (img.offsetWidth > 100 || img.offsetHeight > 100) {
                        // Reset hardcoded HTML/CSS rendering compression locks
                        img.style.width = "auto";
                        img.style.height = "auto";
                        img.style.maxWidth = "100%";
                        img.style.maxHeight = "100%";
                        
                        // Force modern high-fidelity rendering methods
                        img.style.imageRendering = "-webkit-optimize-contrast";
                        img.style.imageRendering = "crisp-edges";
                        img.style.imageRendering = "quality";
                        
                        // Prevent browser blurring caused by subpixel layer offsets
                        img.style.transform = "translateZ(0)";
                    }
                }
            } catch (e) {
                console.warn("Security policy blocked iframe asset adjustment. Run via Live Server.");
            }
        });

        window.addEventListener('resize', resizeCatalogue);
        leftZone.addEventListener('click', () => currentPage > 1 && updateCatalogView(currentPage - 1));
        rightZone.addEventListener('click', () => currentPage < totalPages && updateCatalogView(currentPage + 1));

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                if (currentPage < totalPages) updateCatalogView(currentPage + 1);
            } else if (e.key === 'ArrowLeft') {
                if (currentPage > 1) updateCatalogView(currentPage - 1);
            }
        });

        dropdown.addEventListener('change', (e) => updateCatalogView(e.target.value));
        prevBtn.addEventListener('click', () => currentPage > 1 && updateCatalogView(currentPage - 1));
        nextBtn.addEventListener('click', () => currentPage < totalPages && updateCatalogView(currentPage + 1));

        resizeCatalogue();
        updateCatalogView(1);
    </script>

</body>
</html>
