<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blessed by the Bees - Exhibition Catalogue</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0;
            box-sizing: border-box;
            height: 100vh;
            position: relative;
        }
        #viewport-container {
            width: 100%;
            height: 88vh; /* Maximized to make your artwork fill the screen */
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        #catalogue-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            border-radius: 4px;
        }
        /* Full-screen touch/click targets for natural side navigation */
        .click-zone {
            position: absolute;
            top: 0;
            height: 100%;
            width: 50%;
            z-index: 25;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        #left-zone { left: 0; }
        #right-zone { right: 0; }

        .nav-controls {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 12px 0 20px 0;
            background-color: #111111;
            z-index: 30;
        }
        .nav-btn {
            background-color: #ff5722;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .nav-btn:hover {
            background-color: #e64a19;
        }
        .nav-btn:disabled {
            background-color: #333;
            color: #777;
            cursor: not-allowed;
            box-shadow: none;
            opacity: 0.4;
        }
        .page-select {
            background-color: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 9px 18px;
            font-size: 0.95rem;
            border-radius: 4px;
            cursor: pointer;
            outline: none;
        }
        @media (max-width: 768px) {
            #viewport-container {
                height: 80vh;
            }
        }
    </style>
</head>
<body>

    <div id="main-container">
        <div id="viewport-container">
            <div id="left-zone" class="click-zone"></div>
            <div id="right-zone" class="click-zone"></div>
            <img id="catalogue-img" src="" alt="Exhibition Catalogue Page">
        </div>

        <div class="nav-controls">
            <button id="prev-page-btn" class="nav-btn">◀ Previous</button>
            <select id="page-dropdown" class="page-select"></select>
            <button id="next-page-btn" class="nav-btn">Next ▶</button>
        </div>
    </div>

    <script>
        const totalPages = 17;
        let currentPage = 1;
        
        const dropdown = document.getElementById('page-dropdown');
        const prevBtn = document.getElementById('prev-page-btn');
        const nextBtn = document.getElementById('next-page-btn');
        const catalogueImg = document.getElementById('catalogue-img');
        const leftZone = document.getElementById('left-zone');
        const rightZone = document.getElementById('right-zone');

        for (let i = 1; i <= totalPages; i++) {
            let opt = document.createElement('option');
            opt.value = i;
            opt.textContent = `Page ${i} of ${totalPages}`;
            dropdown.appendChild(opt);
        }

        function updateCatalogView(newPage) {
            currentPage = parseInt(newPage);
            dropdown.value = currentPage;
            
            // Reverted path to look for your specific folder image names with spaces and brackets
            const pathString = `publication-web-resources/image/page (${currentPage}).jpg`;
            const cleanPath = encodeURI(pathString);
            const cacheBuster = new Date().getTime();
            
            catalogueImg.src = `${cleanPath}?cb=${cacheBuster}`;
            
            prevBtn.disabled = (currentPage === 1);
            nextBtn.disabled = (currentPage === totalPages);
        }

        leftZone.addEventListener('click', () => {
            if (currentPage > 1) updateCatalogView(currentPage - 1);
        });

        rightZone.addEventListener('click', () => {
            if (currentPage < totalPages) updateCatalogView(currentPage + 1);
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                if (currentPage < totalPages) updateCatalogView(currentPage + 1);
            } else if (e.key === 'ArrowLeft') {
                if (currentPage > 1) updateCatalogView(currentPage - 1);
            }
        });

        dropdown.addEventListener('change', (e) => updateCatalogView(e.target.value));
        prevBtn.addEventListener('click', () => currentPage > 1 && updateCatalogView(currentPage - 1));
        nextBtn.addEventListener('click', () => currentPage < totalPages && updateCatalogView(currentPage + 1));

        updateCatalogView(1);
    </script>

</body>
</html>
