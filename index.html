<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exhibition Catalogue</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111111;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #viewport-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        /* Forces your native InDesign layout elements to fill the screen, center, and unlock touch navigation */
        .publication-content {
            width: 100% !important;
            height: 100% !important;
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div id="viewport-container">
        <!-- Connects your native resource folder directly into the webpage without blocking clicks -->
        <object data="publication-web-resources/html/publication.html" type="text/html" class="publication-content">
            <embed src="publication-web-resources/html/publication.html" type="text/html" class="publication-content" />
        </object>
    </div>

</body>
</html>
