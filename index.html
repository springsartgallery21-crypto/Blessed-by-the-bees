<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blessed by the Bees - Exhibition Catalogue</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111111; /* Sleek dark gallery background */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #viewport-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        /* Automatically forces the InDesign book content to center and scale flawlessly across all screens */
        .fullscreen-viewer {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div id="viewport-container">
        <!-- 
          Hooks directly into your active InDesign publication document view code 
          bypassing broken top-level script wrappers 
        -->
        <iframe 
            src="publication-web-resources/html/publication.html" 
            class="fullscreen-viewer" 
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
